
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedElder Care | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <header>
        <div class="brand-icon">✚</div>
        <h1>MedElder Care</h1>
        <p>Medication Management System for Old Age Homes</p>
    </header>

    <main>
        <section class="login-section">

            <div class="login-logo">♥</div>

            <h2>Welcome Back</h2>
            <p>Sign in to access your care dashboard.</p>

            <form id="loginForm">
                <input
                    type="text"
                    id="username"
                    placeholder="Enter Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >

                <button type="submit">Login to MedElder Care</button>
            </form>

            <p id="loginMessage"></p>

        </section>
    </main>

    <footer>
        <p>MedElder Care | Caring Today. Healthier Tomorrow. ♥</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
